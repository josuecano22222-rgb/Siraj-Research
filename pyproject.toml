[project]
name = "siraj_research"
authors = [
    { name = "siraj_research", email = "josuecano22222@gmail.com"}
]
description = "siraj_research"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Geospatial stack for boundary import + geo_resolve (Phase 2/3).
    # These are OPTIONAL: geo_import.deps_ok() and the "Check dependencies"
    # button on Boundary Dataset tell the admin what to install if they
    # are missing. We list them as comments rather than hard dependencies
    # so the app boots on benches without a C toolchain.
    # "shapely>=2.0",
    # "pyproj>=3.6",
    # "pyogrio>=0.7",   # preferred over fiona
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "RUF001", # Unicode characters (Arabic digits, ×) are used intentionally
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"frappe".msg = "frappe is provided by the Bench runtime; ensure imports are compatible with Frappe v15."

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
