name: Linters

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validators:
    name: 'JSON + Syntax + Diff hygiene'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Validate DocType JSON
        run: |
          python -c "
          import json, glob, sys
          errors = 0
          for p in glob.glob('siraj_research/**/*.json', recursive=True):
              try:
                  json.load(open(p, encoding='utf-8'))
              except Exception as e:
                  print(f'INVALID {p}: {e}')
                  errors += 1
          sys.exit(errors)
          "

      - name: Validate Python syntax
        run: |
          python -c "
          import ast, glob, sys
          errors = 0
          for p in glob.glob('siraj_research/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True):
              try:
                  ast.parse(open(p, encoding='utf-8').read())
              except SyntaxError as e:
                  print(f'SYNTAX {p}:{e.lineno}: {e.msg}')
                  errors += 1
          sys.exit(errors)
          "

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc on .
