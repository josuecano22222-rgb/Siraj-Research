# Advisory full-bench integration. Not required for merge while Setup bench
# remains flaky on hosted runners; promote to required once green for a week.
name: Server (advisory)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Server
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MariaDB Client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mariadb-client
          printf "[client]\nskip-ssl\n" > ~/.my.cnf

      - name: Setup bench
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Setup bench failed::exit $? at: $BASH_COMMAND"' ERR
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app and site
        working-directory: /home/runner/frappe-bench
        run: |
          set -Eeuo pipefail
          LOG=/tmp/server-install.log
          : > "$LOG"
          # tee all install output to $LOG so the failure tail is readable in
          # the job output and uploadable as an artifact (CI logs are often not
          # retrievable from outside the job). Capture the real exit code via
          # PIPESTATUS so a failing bench command does not get masked by tee.
          set +e
          {
            echo "=== install start $(date -u) ==="
            bench get-app siraj_research $GITHUB_WORKSPACE
            bench setup requirements --dev
            bench new-site --db-root-password root --admin-password admin test_site
            bench --site test_site install-app siraj_research
            # Only this app's bundle is needed for run-tests; skipping the
            # full multi-app build keeps the job fast and avoids the
            # historical full-build failure mode.
            bench build --app siraj_research
            echo "=== install end $(date -u) ==="
          } 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Install app and site failed::exit $rc"
            echo "--- last 80 lines of $LOG ---"
            tail -80 "$LOG"
            exit "$rc"
          fi
        env:
          CI: 'Yes'

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-install-log
          path: /tmp/server-install.log
          if-no-files-found: ignore

      - name: Run Frappe server tests
        working-directory: /home/runner/frappe-bench
        run: |
          echo "::notice title=server tests::step started (head ${GITHUB_SHA::8})"
          bench --site test_site set-config allow_tests true
          # Each module's exit code is captured via PIPESTATUS so the loop keeps
          # going on failure. Scope = release-gate modules (a bare --app run
          # would also pull in the eight modules CI deliberately ignores). Run
          # logs are sign-in gated for API readers, so per-module results and the
          # failing tail are re-emitted as annotations (%0A = newline) and the
          # full log is uploaded as an artifact.
          status=0
          : > /tmp/server-tests.log
          for module in \
            test_api_data_group_isolation \
            test_api_static \
            test_audit_api \
            test_auto_fill_defaults \
            test_role_visibility \
            test_quality_scoring \
            test_demo_data \
            test_map_search_api \
            test_person_family \
            siraj_research.siraj_research.doctype.shared_record.test_shared_record \
            siraj_research.siraj_research.doctype.siraj_event.test_siraj_event
          do
            if [[ "$module" == siraj_research.* ]]; then
              target_module="$module"
            else
              target_module="siraj_research.tests.$module"
            fi
            # tee run-tests output to the log so it is visible in the job output
            # and uploadable as an artifact; capture the real exit code via
            # PIPESTATUS so a failing module is not masked by tee.
            { echo "=== $module ==="; bench --site test_site run-tests --module "$target_module"; } 2>&1 | tee -a /tmp/server-tests.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              status=1
            fi
          done
          grep -E "^(=== |Ran [0-9]+ test|OK.*|FAILED \()" /tmp/server-tests.log | tail -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/results-encoded.txt
          if [ "$status" -ne 0 ]; then
            echo "--- last 80 lines of /tmp/server-tests.log ---"
            tail -80 /tmp/server-tests.log
            # List every FAIL / ERROR / UNEXPECTED SUCCESS header plus the first full traceback.
            grep -E "^(FAIL|ERROR|UNEXPECTED SUCCESS): " /tmp/server-tests.log | head -20 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > /tmp/failids-encoded.txt
            awk '/^(FAIL|ERROR|UNEXPECTED SUCCESS): /{n++} n==1{print} n==2{exit}' /tmp/server-tests.log | tail -40 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' | head -c 4500 > /tmp/failures-encoded.txt
            echo "::error title=run-tests failures::$(cat /tmp/results-encoded.txt)$(cat /tmp/failids-encoded.txt)$(cat /tmp/failures-encoded.txt)"
          else
            echo "::notice title=run-tests passed::$(cat /tmp/results-encoded.txt)"
          fi
          exit "$status"
        env:
          TYPE: server

      - name: Upload server tests log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-tests-log
          path: /tmp/server-tests.log
          if-no-files-found: ignore
