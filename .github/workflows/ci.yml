# Required PR gate for siraj_research.
# Runs the suites that are green on a clean checkout of main, plus syntax/JSON
# validation. Full bench integration lives in server.yml (advisory until stable).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pure-python-tests:
    name: Pure-Python Unit Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install deps
        run: pip install pytest cryptography

      - name: Run pure-Python tests (no bench required)
        run: |
          # Known-red legacy files are excluded so the gate stays honest and green
          # on main. Each exclusion is a tracked debt item, not a silent skip.
          python -m pytest tests/ \
            --ignore=tests/test_coordinate_audit.py \
            --ignore=tests/test_default_workflow_state.py \
            --ignore=tests/test_fixture_controllers.py \
            --ignore=tests/test_geo_import.py \
            --ignore=tests/test_master_data.py \
            --ignore=tests/test_test_data.py \
            --ignore=tests/test_treeview.py \
            --ignore=tests/test_visualization.py \
            -q

  node-unit-tests:
    name: Node Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pure-Node suites (no browser required)
        run: |
          set -e
          for f in \
            tests/test_boundary_review.js \
            tests/test_geography_action_i18n.js \
            tests/test_ui_lifecycle_guards.js \
            tests/test_explorer_assets.js \
            tests/test_load_probe.js \
            tests/test_map_search_ui.js \
            tests/test_offline_records.js \
            tests/test_signed_snapshot_adversarial.js \
            tests/test_signed_snapshot_crypto.js \
            tests/test_siraj_cascade_core.js \
            tests/test_siraj_geopoint_core.js
          do
            echo "::group::node $f"
            node "$f"
            echo "::endgroup::"
          done

  static-validation:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate DocType JSON
        run: |
          python -c "
          import json, glob, sys
          errors = 0
          for p in glob.glob('siraj_research/**/*.json', recursive=True):
              try:
                  json.load(open(p, encoding='utf-8'))
              except Exception as e:
                  print(f'INVALID {p}: {e}')
                  errors += 1
          sys.exit(errors)
          "

      - name: Validate Python syntax
        run: |
          python -c "
          import ast, glob, sys
          errors = 0
          for p in glob.glob('siraj_research/**/*.py', recursive=True) + glob.glob('tests/**/*.py', recursive=True):
              try:
                  ast.parse(open(p, encoding='utf-8').read())
              except SyntaxError as e:
                  print(f'SYNTAX {p}:{e.lineno}: {e.msg}')
                  errors += 1
          sys.exit(errors)
          "

      - name: Fail on whitespace errors in the diff
        # patches/ holds historical transfer artifacts whose embedded content
        # is not source; exclude it so the check stays about real code.
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          git diff --check "$BASE"...HEAD -- . ':(exclude)patches'

  ruff-changed-files:
    name: Ruff (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff==0.8.1

      - name: Lint only files touched by this PR/commit
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed; skipping ruff."
            exit 0
          fi
          echo "Linting ${#files[@]} file(s):"
          printf '  %s\n' "${files[@]}"
          ruff check "${files[@]}"
          # Undefined-name guard for the pure API/utils layer: the project
          # config ignores F821 (bench-runtime names), which once hid a
          # missing import that only exploded on a real site. These two
          # dirs import frappe explicitly, so F821 there is always a bug.
          ruff check --isolated --select F821 siraj_research/api siraj_research/utils
